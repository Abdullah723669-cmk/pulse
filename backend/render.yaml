services:
  - type: web
    name: pulse-backend-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "npm install && npm run prisma:generate && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with your Neon connection string
      - key: DIRECT_URL
        sync: false # Set in Render Dashboard with your Neon direct connection string
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard to your Firebase hosting URL
